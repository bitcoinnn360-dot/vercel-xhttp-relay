name: Refresh official TSETMC IFB impacts

on:
  schedule:
    # Iran market week, shortly after the cash close.
    - cron: '15 9 * * 0-3,6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-tsetmc-ifb-impacts
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/fix-index-history-ta-retail-db3c
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/collect_tsetmc_impacts.mjs
      - name: Publish official IFB ranking
        run: |
          if git diff --quiet -- public/data/impacts_cache.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/impacts_cache.json
          git commit -m 'data: refresh official TSETMC IFB impacts'
          git push origin HEAD:cursor/fix-index-history-ta-retail-db3c
      - run: npm ci
      - run: npm run build
      - name: Build Pages Functions worker
        run: |
          npx wrangler pages functions build functions \
            --outdir=dist/.functions-worker \
            --output-routes-path=dist/_routes.json
          cp dist/.functions-worker/index.js dist/_worker.js
      - name: Deploy refreshed dashboard
        run: npx wrangler pages deploy dist --project-name=arz-digital-dashboard --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

