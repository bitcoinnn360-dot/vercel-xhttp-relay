name: Deploy dashboard to Cloudflare Pages

on:
  push:
    branches:
      - cursor/fix-index-history-ta-retail-db3c
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate BourseView-only snapshots
        run: node scripts/fetch_bourseview_snapshots.mjs
        env:
          BOURSEVIEW_COOKIE: ${{ secrets.BOURSEVIEW_COOKIE_V4 }}
      - run: npm run build
      - name: Build Pages Functions worker
        run: |
          npx wrangler pages functions build functions \
            --outdir=dist/.functions-worker \
            --output-routes-path=dist/_routes.json
          cp dist/.functions-worker/index.js dist/_worker.js
      - name: Sync BourseView credentials
        run: printf '%s' "$BOURSEVIEW_COOKIE" | npx wrangler pages secret put BOURSEVIEW_COOKIE --project-name=arz-digital-dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BOURSEVIEW_COOKIE: ${{ secrets.BOURSEVIEW_COOKIE_V4 }}
      - name: Sync Custeel credentials
        run: |
          printf '%s' "$CUSTEEL_USER" | npx wrangler pages secret put CUSTEEL_USER --project-name=arz-digital-dashboard
          printf '%s' "$CUSTEEL_PASS" | npx wrangler pages secret put CUSTEEL_PASS --project-name=arz-digital-dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CUSTEEL_USER: ${{ secrets.CUSTEEL_USER }}
          CUSTEEL_PASS: ${{ secrets.CUSTEEL_PASS }}
      - name: Verify BourseView credential from runner
        run: |
          BV_COOKIE="$BOURSEVIEW_COOKIE"
          [[ "$BV_COOKIE" == authentication=* ]] || BV_COOKIE="authentication=$BV_COOKIE"
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 \
            --cookie "$BV_COOKIE" \
            'https://www.bourseview.com/api/v2/exchanges/IRTSENO/stocks/IRO1MADN0001/quotes?timeFrame=daily&lastN=3&expand=shamsiDate')
          echo "BourseView runner status=$status"
          test "$status" = "200"
        env:
          BOURSEVIEW_COOKIE: ${{ secrets.BOURSEVIEW_COOKIE_V4 }}
      - name: Deploy production
        run: npx wrangler pages deploy dist --project-name=arz-digital-dashboard --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Warm live mineral-stock cache
        run: |
          sleep 5
          curl --fail --silent --show-error --max-time 180 \
            "https://www.arz-digital.xyz/api/stocks?refresh=1&deploy=${GITHUB_SHA}" \
            | node -e '
                let body = "";
                process.stdin.on("data", chunk => body += chunk);
                process.stdin.on("end", () => {
                  const data = JSON.parse(body);
                  console.log(`source=${data.source} bourseviewOk=${data.bourseviewOk} rows=${data.stocks?.length || 0}`);
                  if (!data.ok || !String(data.source || "").startsWith("bourseview")) process.exit(1);
                });
              '
      - name: Verify BourseView NAV
        run: |
          curl --fail --silent --show-error --max-time 180 \
            "https://www.arz-digital.xyz/api/nav?deploy=${GITHUB_SHA}" \
            | node -e '
                let body = "";
                process.stdin.on("data", chunk => body += chunk);
                process.stdin.on("end", () => {
                  const data = JSON.parse(body);
                  console.log(`source=${data.source} liveCount=${data.liveCount || 0}`);
                  if (!data.ok || !(data.liveCount > 0) || !String(data.source).startsWith("bourseview")) process.exit(1);
                });
              '
