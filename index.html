<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="داشبورد مدیریتی گزارش روزانه بازار — معادن و فلزات" />
    <title>داشبورد بازار | توسعه معادن و فلزات</title>
    <!-- Self-hosted Vazirmatn + IBM Plex (no Google Fonts — avoids IR blank-page hang) -->
    <link rel="preload" href="/fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Vazirmatn-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <!-- Inline shell fallback: keeps layout usable if the hashed CSS bundle fails -->
    <style>
      body{margin:0;min-height:100vh;font-family:Vazirmatn,"IBM Plex Sans",Tahoma,"Segoe UI",sans-serif;color:#0f172a;background:linear-gradient(180deg,#e8eef5 0%,#f1f5f9 40%,#f8fafc 100%)}
      .app-shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
      .side-nav{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:.35rem;padding:1.1rem .85rem;color:#e2e8f0;background:linear-gradient(180deg,#0b3d6e 0%,#0a2f54 100%)}
      .side-link{display:block;border-radius:8px;padding:.55rem .7rem;font-size:.82rem;font-weight:600;color:#cbd5e1;text-decoration:none}
      .side-extra{margin-top:auto;display:flex;flex-direction:column;gap:.25rem;padding-top:.75rem;border-top:1px solid rgba(255,255,255,.12)}
      .mobile-nav{display:none}
      .main-wrap{width:min(1280px,calc(100% - 2rem));margin-inline:auto;padding:1rem 0 2.5rem}
      .panel{background:#fff;border:1px solid #e2e8f0;border-radius:12px}
      @media (max-width:960px){.app-shell{grid-template-columns:1fr}.side-nav{display:none!important}.mobile-nav{display:block!important}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
