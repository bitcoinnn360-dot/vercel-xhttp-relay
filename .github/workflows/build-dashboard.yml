name: Build dashboard artifact

on:
  push:
    branches:
      - cursor/fix-index-history-ta-retail-db3c
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wrangler pages functions build functions --outdir=dist/.functions-worker --output-routes-path=dist/_routes.json
      - run: cp dist/.functions-worker/index.js dist/_worker.js
      - uses: actions/upload-artifact@v4
        with:
          name: arz-digital-dashboard-dist
          path: dist
          if-no-files-found: error
          retention-days: 1
