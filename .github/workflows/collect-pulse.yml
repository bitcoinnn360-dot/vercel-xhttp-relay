name: Collect market pulse

# GitHub's repeated cron events were arriving only about once per hour. Start
# one runner before market open and keep it alive through the cash session so
# TradersArena is sampled even when nobody has the dashboard open.

on:
  schedule:
    # Tehran is UTC+3:30. Start at 08:50 and sample 09:00–13:00 Tehran.
    - cron: '20 5 * * 0-3,6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pulse-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 280
    steps:
      - name: Checkout pulse-data branch
        uses: actions/checkout@v4
        with:
          ref: pulse-data
          fetch-depth: 1

      - name: Refresh collector
        run: |
          git fetch origin cursor/fix-index-history-ta-retail-db3c --depth=1
          git checkout origin/cursor/fix-index-history-ta-retail-db3c -- scripts/collect_pulse.py
          mkdir -p public/data/pulse-days

      - name: Sample the full market session
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pulse-bot"
          git config user.email "pulse-bot@users.noreply.github.com"

          while true; do
            tehran_hhmm="$(TZ=Asia/Tehran date +%H%M)"
            tehran_min=$((10#${tehran_hhmm:0:2} * 60 + 10#${tehran_hhmm:2:2}))

            if (( tehran_min < 540 )); then
              sleep 30
              continue
            fi
            if (( tehran_min > 780 )); then
              break
            fi

            python3 scripts/collect_pulse.py
            if ! git diff --quiet -- scripts/collect_pulse.py market_pulse.json public/data/market_pulse.json public/data/pulse-days; then
              git add scripts/collect_pulse.py market_pulse.json public/data/market_pulse.json public/data/pulse-days
              git commit -m "pulse: update $(TZ=Asia/Tehran date +%Y-%m-%dT%H:%M)"
              git pull --rebase origin pulse-data
              git push origin HEAD:pulse-data
            fi

            epoch="$(date +%s)"
            sleep $((300 - epoch % 300))
          done
